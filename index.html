<title>Variación de precios de compra 2026</title>
<style>
  :root { color-scheme: light dark; --page:#f6f7f8; --card:#fcfcfb; --ink:#0f1419; --ink2:#4f5660; --line:rgba(15,20,25,.14); --accent:#1d5fa8; --err:#c43333; }
  @media (prefers-color-scheme: dark) { :root { --page:#0e1013; --card:#181a1d; --ink:#eef0f2; --ink2:#b9bec5; --line:rgba(255,255,255,.14); --accent:#6aa5ec; --err:#ef7a7a; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--page); color:var(--ink); font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; padding:20px; }

  p { margin:0; color:var(--ink2); font-size:14px; }
  input[type=password] { width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; }
  label { display:flex; gap:8px; align-items:center; color:var(--ink2); font-size:14px; }
  button { font:600 15px system-ui,sans-serif; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; }
  #err { color:var(--err); min-height:1.2em; }
</style>

const CLAVE = 'tablero-precios-acceso';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const a64 = u => btoa(String.fromCharCode.apply(null, u));
async function derivar(pw) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(D.s), iterations: D.n, hash: 'SHA-256' }, k, 512));
}
async function descifrar(bits) {
  const s = b64(D.s), iv = b64(D.i), c = b64(D.c);
  const msg = new Uint8Array(s.length + iv.length + c.length);
  msg.set(s); msg.set(iv, s.length); msg.set(c, s.length + iv.length);
  const km = await crypto.subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  if (!(await crypto.subtle.verify('HMAC', km, b64(D.m), msg))) return null;
  const ka = await crypto.subtle.importKey('raw', bits.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, ka, c));
}
function mostrar(html) { document.open(); document.write(html); document.close(); }
(async () => {
  try {
    const g = JSON.parse(localStorage.getItem(CLAVE) || 'null');
    if (g && g.s === D.s) {
      const html = await descifrar(b64(g.k));
      if (html) return mostrar(html);
      localStorage.removeItem(CLAVE);
    }
  } catch (e) {}
  document.getElementById('pw').focus();
})();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  if (!window.crypto || !crypto.subtle) { err.textContent = 'Este navegador no puede abrir el tablero. Use Chrome o Safari actualizados.'; return; }
  btn.disabled = true; btn.textContent = 'Abriendo…'; err.textContent = '';
  try {
    const bits = await derivar(document.getElementById('pw').value);
    const html = await descifrar(bits);
    if (!html) { err.textContent = 'Contraseña incorrecta.'; return; }
    if (document.getElementById('rec').checked) { try { localStorage.setItem(CLAVE, JSON.stringify({ s: D.s, k: a64(bits) })); } catch (e) {} }
    mostrar(html);
  } catch (e) { err.textContent = 'No se pudo abrir el tablero.'; }
  finally { btn.disabled = false; btn.textContent = 'Abrir tablero'; }
});
})();
